[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h5tui"
version = "1.0.1"
requires-python = ">=3.8.1"
dependencies = [
  "textual",
  "textual_plotext",
  "h5py",
  "numpy",
  "matplotlib",
  "scipy",
  "rapidfuzz",
]
authors = [
  {name = "Kalman Szenes", email = "szenes.kalman@gmail.com"},
]
description = "Vim-style terminal UI for browsing, plotting, and inspecting HDF5 files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "hdf5",
  "h5py",
  "tui",
  "terminal",
  "textual",
  "scientific",
  "visualization",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/kszenes/h5tui"
Documentation = "https://github.com/kszenes/h5tui#readme"
Repository = "https://github.com/kszenes/h5tui"
Issues = "https://github.com/kszenes/h5tui/issues"
Changelog = "https://github.com/kszenes/h5tui/blob/master/CHANGELOG.md"

[project.scripts]
h5tui = "h5tui.h5tui:h5tui"

[tool.setuptools]
include-package-data = true

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "pytest-textual-snapshot>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
